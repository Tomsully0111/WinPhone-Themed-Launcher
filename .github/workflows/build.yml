name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o -q MetroLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: MetroLauncher
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metro-launcher-apk
          path: MetroLauncher/app/build/outputs/apk/debug/*.apk
